[project]
name = "jobme"
version = "0.1.0"
description = "Generative AI for effective job hunting: agentically tailor a resume and cover letter to a job posting and produce send-ready PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aimu[anthropic,ollama]>=0.26.0",
    "anthropic",
    "playwright",
    "weasyprint",
    "pypdf",
    "python-dotenv",
]

[project.scripts]
jobme = "jobme.cli:main"

[project.optional-dependencies]
# Mock-only test suite: no model, no network, no API keys.
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Kokua toolset's tools are async, so their tests are coroutines with no explicit marker.
asyncio_mode = "auto"
