[project]
name = "jobme"
version = "0.1.0"
description = "Generative AI for effective job hunting: agentically tailor a resume and cover letter to a job posting and produce send-ready PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aimu[anthropic,ollama]",
    "playwright",
    "weasyprint",
    "pypdf",
    "python-dotenv",
]

[project.scripts]
jobme = "jobme.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobme*"]

# Use the AIMU checkout in the sibling directory as an editable dependency.
[tool.uv.sources]
aimu = { path = "../aimu", editable = true }
